<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BefJump - Cube Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f7f7f7;
            color: #535353;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            user-select: none;
        }
        
        .game-area {
            width: 100vw;
            height: 100vh;
            background: white;
            position: relative;
            overflow: hidden;
        }
        
        .player {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #535353;
            bottom: 100px;
            left: 100px;
            transition: none;
            border-radius: 4px;
        }
        
        .obstacle {
            position: absolute;
            width: 20px;
            background: #535353;
            bottom: 100px;
        }
        
        .cloud {
            position: absolute;
            width: 80px;
            height: 40px;
            background: #ccc;
            border-radius: 40px;
            opacity: 0.5;
        }
        
        .ground-line {
            position: absolute;
            bottom: 100px;
            left: 0;
            width: 100%;
            height: 4px;
            background: #535353;
        }
        
        .score {
            position: absolute;
            top: 50px;
            right: 50px;
            font-size: 36px;
            font-weight: bold;
        }
        
        .start-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        
        .game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
        }
        
        .high-score {
            font-size: 24px;
            margin-top: 20px;
        }
        
        .instructions {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            color: #888;
        }
        
        .start-text {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        .game-over-text {
            font-size: 48px;
            margin-bottom: 20px;
            letter-spacing: 4px;
        }
        
        .debug {
            position: absolute;
            top: 120px;
            left: 50px;
            font-size: 16px;
            color: #666;
        }
        
        .jump-bar {
            position: absolute;
            top: 50px;
            left: 50px;
            width: 200px;
            height: 20px;
            background: #ddd;
            border: 2px solid #535353;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .jump-fill {
            height: 100%;
            background: linear-gradient(90deg, #0f0 0%, #ff0 50%, #f00 100%);
            width: 0%;
            transition: width 0.05s;
        }
    </style>
</head>
<body>
    <div class="game-area" id="gameArea">
        <div class="ground-line"></div>
        <div class="player" id="player"></div>
        <div class="score" id="score">00000</div>
        
        <div class="jump-bar" id="jumpBar" style="display: none;">
            <div class="jump-fill" id="jumpFill"></div>
        </div>
        
        <div class="debug" id="debug">
            <div>Player Y: <span id="playerY">0</span></div>
            <div>Velocity: <span id="velocity">0</span></div>
            <div>Jumping: <span id="jumping">false</span></div>
            <div>Hold Time: <span id="holdTime">0</span>ms</div>
        </div>
        
        <div class="start-screen" id="startScreen">
            <div class="start-text">Press SPACE to play</div>
            <div class="high-score">HI <span id="hiScore">00000</span></div>
            <div style="font-size: 18px; margin-top: 20px; color: #888;">Hold SPACE longer for higher jumps!</div>
        </div>
        
        <div class="game-over-screen" id="gameOverScreen">
            <div class="game-over-text">G A M E  O V E R</div>
            <div class="high-score">HI <span id="finalHiScore">00000</span></div>
            <div style="font-size: 24px; margin-top: 30px;">Press SPACE to restart</div>
        </div>
    </div>
    
    <div class="instructions">Hold SPACEBAR or ↑ longer for higher jumps</div>

    <script>
        let gameState = {
            running: false,
            gameStarted: false,
            score: 0,
            highScore: parseInt(localStorage.getItem('cube-runner-high-score') || '0'),
            player: { y: 0, jumping: false, velocity: 0 },
            obstacles: [],
            clouds: [],
            gameSpeed: 8,
            lastObstacle: 0,
            lastCloud: 0,
            obstaclePattern: 0,
            
            // Jump charging system
            jumpCharging: false,
            jumpStartTime: 0,
            jumpHoldTime: 0,
            minJumpTime: 50,    // Minimum hold time (ms) 
            maxJumpTime: 400,   // Maximum hold time (ms)
            minJumpPower: -12,  // Minimum jump velocity
            maxJumpPower: -22   // Maximum jump velocity
        };
        
        const player = document.getElementById('player');
        const gameArea = document.getElementById('gameArea');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const scoreElement = document.getElementById('score');
        const hiScoreElement = document.getElementById('hiScore');
        const finalHiScoreElement = document.getElementById('finalHiScore');
        const jumpBar = document.getElementById('jumpBar');
        const jumpFill = document.getElementById('jumpFill');
        
        // Debug elements
        const playerYElement = document.getElementById('playerY');
        const velocityElement = document.getElementById('velocity');
        const jumpingElement = document.getElementById('jumping');
        const holdTimeElement = document.getElementById('holdTime');
        
        // Initialize
        hiScoreElement.textContent = String(gameState.highScore).padStart(5, '0');
        finalHiScoreElement.textContent = String(gameState.highScore).padStart(5, '0');
        
        function startGame() {
            gameState.running = true;
            gameState.gameStarted = true;
            gameState.score = 0;
            gameState.player = { y: 0, jumping: false, velocity: 0 };
            gameState.obstacles = [];
            gameState.clouds = [];
            gameState.gameSpeed = 8;
            gameState.lastObstacle = Date.now();
            gameState.lastCloud = Date.now();
            gameState.obstaclePattern = 0;
            gameState.jumpCharging = false;
            gameState.jumpStartTime = 0;
            gameState.jumpHoldTime = 0;
            
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            jumpBar.style.display = 'block';
            
            // Clear existing elements
            document.querySelectorAll('.obstacle').forEach(obs => obs.remove());
            document.querySelectorAll('.cloud').forEach(cloud => cloud.remove());
            
            // Reset player position
            player.style.bottom = '100px';
            player.style.transform = 'none';
            
            for(let i = 0; i < 5; i++) {
                spawnCloud();
            }
            
            gameLoop();
        }
        
        function startJumpCharge() {
            if (!gameState.gameStarted) {
                startGame();
                return;
            }
            
            if (!gameState.running || gameState.player.jumping || gameState.jumpCharging) return;
            
            gameState.jumpCharging = true;
            gameState.jumpStartTime = Date.now();
        }
        
        function executeJump() {
            if (!gameState.jumpCharging || gameState.player.jumping) return;
            
            gameState.jumpCharging = false;
            gameState.jumpHoldTime = Date.now() - gameState.jumpStartTime;
            
            // Clamp hold time between min and max
            const clampedHoldTime = Math.max(gameState.minJumpTime, 
                                   Math.min(gameState.maxJumpTime, gameState.jumpHoldTime));
            
            // Calculate jump power based on hold time
            const holdRatio = (clampedHoldTime - gameState.minJumpTime) / 
                             (gameState.maxJumpTime - gameState.minJumpTime);
            
            const jumpPower = gameState.minJumpPower + 
                             (gameState.maxJumpPower - gameState.minJumpPower) * holdRatio;
            
            gameState.player.jumping = true;
            gameState.player.velocity = jumpPower;
            
            // Reset jump bar
            jumpFill.style.width = '0%';
        }
        
        function updateJumpBar() {
            if (gameState.jumpCharging) {
                const currentHoldTime = Date.now() - gameState.jumpStartTime;
                const clampedHoldTime = Math.min(gameState.maxJumpTime, currentHoldTime);
                const fillPercentage = (clampedHoldTime / gameState.maxJumpTime) * 100;
                jumpFill.style.width = fillPercentage + '%';
            }
        }
        
        function updatePlayer() {
            if (gameState.player.jumping) {
                gameState.player.velocity += 0.6;
                gameState.player.y += gameState.player.velocity;
                
                if (gameState.player.y >= 0) {
                    gameState.player.y = 0;
                    gameState.player.jumping = false;
                    gameState.player.velocity = 0;
                }
                
                player.style.bottom = (100 + Math.abs(gameState.player.y)) + 'px';
            }
            
            // Update debug info
            playerYElement.textContent = Math.round(gameState.player.y);
            velocityElement.textContent = Math.round(gameState.player.velocity * 10) / 10;
            jumpingElement.textContent = gameState.player.jumping;
            holdTimeElement.textContent = gameState.jumpHoldTime;
        }
        
        function spawnObstacle() {
            const currentTime = Date.now();
            const baseDelay = 1400;
            let delay = baseDelay;
            let obstacleHeight = 80;
            let obstacleWidth = 20;
            
            const score = Math.floor(gameState.score / 6);
            
            if (score > 250) {
                if (Math.random() < 0.25) {
                    delay = Math.random() * 600 + 500;
                    obstacleHeight = Math.random() * 50 + 65;
                    obstacleWidth = Math.random() * 10 + 18;
                } else {
                    delay = Math.random() * 1000 + 1000;
                }
            } else if (score > 150) {
                if (Math.random() < 0.15) {
                    delay = Math.random() * 700 + 600;
                    obstacleHeight = Math.random() * 35 + 70;
                } else {
                    delay = Math.random() * 1200 + 1200;
                }
            } else if (score > 75) {
                delay = Math.random() * 1000 + 1200;
                if (Math.random() < 0.1) {
                    obstacleHeight = Math.random() * 25 + 70;
                }
            } else {
                delay = Math.random() * 800 + 1600;
            }
            
            if (currentTime - gameState.lastObstacle > delay) {
                const obstacle = document.createElement('div');
                obstacle.className = 'obstacle';
                obstacle.style.right = '-' + obstacleWidth + 'px';
                obstacle.style.height = obstacleHeight + 'px';
                obstacle.style.width = obstacleWidth + 'px';
                gameArea.appendChild(obstacle);
                
                gameState.obstacles.push({
                    element: obstacle,
                    x: window.innerWidth + obstacleWidth,
                    width: obstacleWidth,
                    height: obstacleHeight
                });
                
                gameState.lastObstacle = currentTime;
                
                if (score > 150 && Math.random() < 0.1) {
                    gameState.lastObstacle = currentTime - delay + 400;
                }
            }
        }
        
        function spawnCloud() {
            if (Date.now() - gameState.lastCloud > Math.random() * 3000 + 4000) {
                const cloud = document.createElement('div');
                cloud.className = 'cloud';
                cloud.style.right = '-80px';
                cloud.style.top = Math.random() * (window.innerHeight - 300) + 100 + 'px';
                gameArea.appendChild(cloud);
                
                gameState.clouds.push({
                    element: cloud,
                    x: window.innerWidth + 80
                });
                
                gameState.lastCloud = Date.now();
            }
        }
        
        function updateObstacles() {
            gameState.obstacles = gameState.obstacles.filter(obstacle => {
                obstacle.x -= gameState.gameSpeed;
                obstacle.element.style.right = (window.innerWidth - obstacle.x) + 'px';
                
                if (obstacle.x < -obstacle.width) {
                    obstacle.element.remove();
                    return false;
                }
                return true;
            });
        }
        
        function updateClouds() {
            gameState.clouds = gameState.clouds.filter(cloud => {
                cloud.x -= gameState.gameSpeed * 0.5;
                cloud.element.style.right = (window.innerWidth - cloud.x) + 'px';
                
                if (cloud.x < -80) {
                    cloud.element.remove();
                    return false;
                }
                return true;
            });
        }
        
        function checkCollisions() {
            const playerRect = {
                x: 100,
                y: Math.abs(gameState.player.y),
                width: 40,
                height: 40
            };
            
            for (let obstacle of gameState.obstacles) {
                const obstacleRect = {
                    x: obstacle.x,
                    y: 0,
                    width: obstacle.width,
                    height: obstacle.height
                };
                
                if (playerRect.x < obstacleRect.x + obstacleRect.width &&
                    playerRect.x + playerRect.width > obstacleRect.x &&
                    playerRect.y < obstacleRect.y + obstacleRect.height &&
                    playerRect.y + playerRect.height > obstacleRect.y) {
                    
                    gameOver();
                    return;
                }
            }
        }
        
        function updateScore() {
            gameState.score += 1;
            
            if (gameState.score % 6 === 0) {
                const displayScore = Math.floor(gameState.score / 6);
                scoreElement.textContent = String(displayScore).padStart(5, '0');
                
                if (displayScore % 75 === 0 && displayScore > 0) {
                    gameState.gameSpeed += 1;
                }
            }
        }
        
        function gameOver() {
            gameState.running = false;
            gameState.jumpCharging = false;
            jumpBar.style.display = 'none';
            jumpFill.style.width = '0%';
            
            const finalScore = Math.floor(gameState.score / 6);
            
            if (finalScore > gameState.highScore) {
                gameState.highScore = finalScore;
                localStorage.setItem('cube-runner-high-score', gameState.highScore.toString());
                hiScoreElement.textContent = String(gameState.highScore).padStart(5, '0');
                finalHiScoreElement.textContent = String(gameState.highScore).padStart(5, '0');
            }
            
            gameOverScreen.style.display = 'block';
        }
        
        function gameLoop() {
            if (!gameState.running) return;
            
            updatePlayer();
            updateJumpBar();
            spawnObstacle();
            spawnCloud();
            updateObstacles();
            updateClouds();
            checkCollisions();
            updateScore();
            
            requestAnimationFrame(gameLoop);
        }
        
        // Controls - Hold to charge jump
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if (!e.repeat) { // Only start charging on first keydown
                    startJumpCharge();
                }
            }
        });
        
        document.addEventListener('keyup', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                executeJump();
            }
        });
        
        // Mobile support - touch and hold
        let touchStartTime = 0;
        document.addEventListener('touchstart', (e) => {
            e.preventDefault();
            touchStartTime = Date.now();
            startJumpCharge();
        });
        
        document.addEventListener('touchend', (e) => {
            e.preventDefault();
            executeJump();
        });
        
        // Restart after game over
        document.addEventListener('keydown', (e) => {
            if (!gameState.running && gameState.gameStarted && (e.code === 'Space' || e.code === 'ArrowUp')) {
                if (!e.repeat) {
                    e.preventDefault();
                    startGame();
                }
            }
        });
        
        window.addEventListener('resize', () => {
            gameState.obstacles.forEach(obstacle => {
                obstacle.element.style.right = (window.innerWidth - obstacle.x) + 'px';
            });
            gameState.clouds.forEach(cloud => {
                cloud.element.style.right = (window.innerWidth - cloud.x) + 'px';
            });
        });
    </script>
</body>
</html>
