<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BefJump - Cube Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f7f7f7;
            color: #535353;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }
        
        .game-container {
            text-align: center;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 20px;
        }
        
        .game-area {
            width: 600px;
            height: 150px;
            background: white;
            position: relative;
            overflow: hidden;
            margin: 20px auto;
            border-bottom: 2px solid #535353;
        }
        
        .player {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #535353;
            bottom: 0px;
            left: 50px;
        }
        
        .obstacle {
            position: absolute;
            width: 10px;
            height: 30px;
            background: #535353;
            bottom: 0px;
        }
        
        .cloud {
            position: absolute;
            width: 40px;
            height: 20px;
            background: #ccc;
            border-radius: 20px;
            opacity: 0.5;
        }
        
        .ground-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #535353;
        }
        
        .score {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 16px;
            font-weight: bold;
        }
        
        .start-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        
        .game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
        }
        
        .high-score {
            font-size: 12px;
            margin-top: 5px;
        }
        
        .instructions {
            font-size: 12px;
            margin-top: 20px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-area" id="gameArea">
            <div class="ground-line"></div>
            <div class="player" id="player"></div>
            <div class="score" id="score">00000</div>
            
            <div class="start-screen" id="startScreen">
                <div style="font-size: 18px; margin-bottom: 10px;">Press SPACE to play</div>
                <div class="high-score">HI <span id="hiScore">00000</span></div>
            </div>
            
            <div class="game-over-screen" id="gameOverScreen">
                <div style="font-size: 18px; margin-bottom: 10px;">G A M E  O V E R</div>
                <div class="high-score">HI <span id="finalHiScore">00000</span></div>
                <div style="font-size: 12px; margin-top: 10px;">Press SPACE to restart</div>
            </div>
        </div>
        <div class="instructions">Use SPACEBAR or ↑ to jump</div>
    </div>

    <script>
        let gameState = {
            running: false,
            gameStarted: false,
            score: 0,
            highScore: parseInt(localStorage.getItem('cube-runner-high-score') || '0'),
            player: { y: 0, jumping: false, velocity: 0 },
            obstacles: [],
            clouds: [],
            gameSpeed: 4,
            lastObstacle: 0,
            lastCloud: 0,
            groundOffset: 0
        };
        
        const player = document.getElementById('player');
        const gameArea = document.getElementById('gameArea');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const scoreElement = document.getElementById('score');
        const hiScoreElement = document.getElementById('hiScore');
        const finalHiScoreElement = document.getElementById('finalHiScore');
        
        // Initialize
        hiScoreElement.textContent = String(gameState.highScore).padStart(5, '0');
        finalHiScoreElement.textContent = String(gameState.highScore).padStart(5, '0');
        
        function startGame() {
            gameState.running = true;
            gameState.gameStarted = true;
            gameState.score = 0;
            gameState.player = { y: 0, jumping: false, velocity: 0 };
            gameState.obstacles = [];
            gameState.clouds = [];
            gameState.gameSpeed = 4;
            gameState.lastObstacle = Date.now();
            gameState.lastCloud = Date.now();
            gameState.groundOffset = 0;
            
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            
            // Clear existing elements
            document.querySelectorAll('.obstacle').forEach(obs => obs.remove());
            document.querySelectorAll('.cloud').forEach(cloud => cloud.remove());
            
            player.style.bottom = '0px';
            
            // Spawn initial clouds
            for(let i = 0; i < 3; i++) {
                spawnCloud();
            }
            
            gameLoop();
        }
        
        function jump() {
            if (!gameState.gameStarted) {
                startGame();
                return;
            }
            
            if (!gameState.running || gameState.player.jumping) return;
            
            gameState.player.jumping = true;
            gameState.player.velocity = -12;
        }
        
        function updatePlayer() {
            if (gameState.player.jumping) {
                gameState.player.velocity += 0.6; // gravity
                gameState.player.y += gameState.player.velocity;
                
                if (gameState.player.y >= 0) {
                    gameState.player.y = 0;
                    gameState.player.jumping = false;
                    gameState.player.velocity = 0;
                }
                
                player.style.bottom = gameState.player.y + 'px';
            }
        }
        
        function spawnObstacle() {
            if (Date.now() - gameState.lastObstacle > Math.random() * 1000 + 1500) {
                const obstacle = document.createElement('div');
                obstacle.className = 'obstacle';
                obstacle.style.right = '-10px';
                gameArea.appendChild(obstacle);
                
                gameState.obstacles.push({
                    element: obstacle,
                    x: 610
                });
                
                gameState.lastObstacle = Date.now();
            }
        }
        
        function spawnCloud() {
            if (Date.now() - gameState.lastCloud > Math.random() * 2000 + 3000) {
                const cloud = document.createElement('div');
                cloud.className = 'cloud';
                cloud.style.right = '-40px';
                cloud.style.top = Math.random() * 60 + 20 + 'px';
                gameArea.appendChild(cloud);
                
                gameState.clouds.push({
                    element: cloud,
                    x: 640
                });
                
                gameState.lastCloud = Date.now();
            }
        }
        
        function updateObstacles() {
            gameState.obstacles = gameState.obstacles.filter(obstacle => {
                obstacle.x -= gameState.gameSpeed;
                obstacle.element.style.right = (610 - obstacle.x) + 'px';
                
                if (obstacle.x < -10) {
                    obstacle.element.remove();
                    return false;
                }
                return true;
            });
        }
        
        function updateClouds() {
            gameState.clouds = gameState.clouds.filter(cloud => {
                cloud.x -= gameState.gameSpeed * 0.5; // clouds move slower
                cloud.element.style.right = (640 - cloud.x) + 'px';
                
                if (cloud.x < -40) {
                    cloud.element.remove();
                    return false;
                }
                return true;
            });
        }
        
        function checkCollisions() {
            const playerRect = {
                x: 50,
                y: gameState.player.y,
                width: 20,
                height: 20
            };
            
            for (let obstacle of gameState.obstacles) {
                const obstacleRect = {
                    x: obstacle.x,
                    y: 0,
                    width: 10,
                    height: 30
                };
                
                if (playerRect.x < obstacleRect.x + obstacleRect.width &&
                    playerRect.x + playerRect.width > obstacleRect.x &&
                    playerRect.y < obstacleRect.y + obstacleRect.height &&
                    playerRect.y + playerRect.height > obstacleRect.y) {
                    
                    gameOver();
                    return;
                }
            }
        }
        
        function updateScore() {
            gameState.score += 1;
            
            // Score increases every 6 frames (10fps)
            if (gameState.score % 6 === 0) {
                const displayScore = Math.floor(gameState.score / 6);
                scoreElement.textContent = String(displayScore).padStart(5, '0');
                
                // Increase speed every 100 points
                if (displayScore % 100 === 0 && displayScore > 0) {
                    gameState.gameSpeed += 0.5;
                }
            }
        }
        
        function gameOver() {
            gameState.running = false;
            
            const finalScore = Math.floor(gameState.score / 6);
            
            if (finalScore > gameState.highScore) {
                gameState.highScore = finalScore;
                localStorage.setItem('cube-runner-high-score', gameState.highScore.toString());
                hiScoreElement.textContent = String(gameState.highScore).padStart(5, '0');
                finalHiScoreElement.textContent = String(gameState.highScore).padStart(5, '0');
            }
            
            gameOverScreen.style.display = 'block';
        }
        
        function gameLoop() {
            if (!gameState.running) return;
            
            updatePlayer();
            spawnObstacle();
            spawnCloud();
            updateObstacles();
            updateClouds();
            checkCollisions();
            updateScore();
            
            requestAnimationFrame(gameLoop);
        }
        
        // Controls - just like Chrome Dino
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                jump();
            }
        });
        
        // Mobile support
        document.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        });
        
        // Restart after game over
        document.addEventListener('keydown', (e) => {
            if (!gameState.running && gameState.gameStarted && (e.code === 'Space' || e.code === 'ArrowUp')) {
                e.preventDefault();
                startGame();
            }
        });
    </script>
</body>
</html>
