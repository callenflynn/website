<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BefJump - Cube Game</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .game-container {
            text-align: center;
        }
        
        .game-area {
            width: 800px;
            height: 400px;
            background: #001122;
            border: 2px solid #0f0;
            position: relative;
            overflow: hidden;
            margin: 20px auto;
        }
        
        .player {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #f00;
            bottom: 50px;
            left: 100px;
            border-radius: 5px;
            transition: none;
        }
        
        .obstacle {
            position: absolute;
            width: 25px;
            height: 50px;
            background: #0ff;
            bottom: 50px;
            border-radius: 3px;
        }
        
        .ground {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: #333;
            border-top: 2px solid #0f0;
        }
        
        .ui {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 18px;
            z-index: 10;
        }
        
        .start-screen, .game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border: 2px solid #0f0;
            border-radius: 10px;
            z-index: 100;
        }
        
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            border-radius: 5px;
            font-weight: bold;
        }
        
        button:hover {
            background: #0c0;
            transform: scale(1.05);
        }
        
        @media (max-width: 900px) {
            .game-area {
                width: 90vw;
                max-width: 800px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🚀 BefJump</h1>
        <div class="game-area" id="gameArea">
            <div class="ground"></div>
            <div class="player" id="player"></div>
            <div class="ui" id="ui">
                <div>Score: <span id="score">0</span></div>
                <div>High Score: <span id="highScore">0</span></div>
                <div style="font-size: 14px; margin-top: 5px;">Jump Height: <span id="jumpHeight">0</span></div>
            </div>
            
            <div class="start-screen" id="startScreen">
                <h2>🎮 BefJump Cube Game</h2>
                <p>Press SPACE or click to jump!</p>
                <p>Avoid the cyan obstacles</p>
                <button onclick="startGame()">🚀 Start Game</button>
            </div>
            
            <div class="game-over-screen" id="gameOverScreen" style="display: none;">
                <h2>💥 Game Over!</h2>
                <p>Score: <span id="finalScore">0</span></p>
                <p id="newHighScore" style="display: none; color: #ff0;">🎉 New High Score!</p>
                <button onclick="startGame()">🔄 Play Again</button>
            </div>
        </div>
        <p>Use SPACE or click anywhere to jump over obstacles!</p>
    </div>

    <script>
        console.log('🎮 BefJump game loading...');
        
        let gameState = {
            running: false,
            score: 0,
            highScore: parseInt(localStorage.getItem('befjump-high-score') || '0'),
            player: { y: 0, jumping: false, velocity: 0 },
            obstacles: [],
            gameSpeed: 2,
            lastObstacle: 0
        };
        
        const player = document.getElementById('player');
        const gameArea = document.getElementById('gameArea');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const finalScoreElement = document.getElementById('finalScore');
        const newHighScoreElement = document.getElementById('newHighScore');
        const jumpHeightElement = document.getElementById('jumpHeight');
        
        console.log('High score:', gameState.highScore);
        highScoreElement.textContent = gameState.highScore;
        
        function startGame() {
            console.log('🚀 Starting game...');
            gameState.running = true;
            gameState.score = 0;
            gameState.player = { y: 0, jumping: false, velocity: 0 };
            gameState.obstacles = [];
            gameState.gameSpeed = 2;
            gameState.lastObstacle = Date.now();
            
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            
            document.querySelectorAll('.obstacle').forEach(obs => obs.remove());
            
            player.style.bottom = '50px';
            
            gameLoop();
        }
        
        function jump() {
            if (!gameState.running || gameState.player.jumping) return;
            
            console.log('🦘 Jump!');
            gameState.player.jumping = true;
            gameState.player.velocity = -25; // Much stronger jump!
        }
        
        function updatePlayer() {
            if (gameState.player.jumping) {
                gameState.player.velocity += 0.8; 
                gameState.player.y += gameState.player.velocity;
                
                if (gameState.player.y >= 0) {
                    gameState.player.y = 0;
                    gameState.player.jumping = false;
                    gameState.player.velocity = 0;
                }
                
                player.style.bottom = (50 - gameState.player.y) + 'px';
                
                jumpHeightElement.textContent = Math.round(-gameState.player.y);
            }
        }
        
        function spawnObstacle() {
            if (Date.now() - gameState.lastObstacle > 2500) { 
                const obstacle = document.createElement('div');
                obstacle.className = 'obstacle';
                obstacle.style.right = '-25px';
                gameArea.appendChild(obstacle);
                
                gameState.obstacles.push({
                    element: obstacle,
                    x: 825
                });
                
                gameState.lastObstacle = Date.now();
                console.log('🚧 Obstacle spawned');
            }
        }
        
        function updateObstacles() {
            gameState.obstacles = gameState.obstacles.filter(obstacle => {
                obstacle.x -= gameState.gameSpeed;
                obstacle.element.style.right = (825 - obstacle.x) + 'px';
                
                if (obstacle.x < -25) {
                    obstacle.element.remove();
                    return false;
                }
                return true;
            });
        }
        
        function checkCollisions() {
            const playerRect = {
                x: 100,
                y: -gameState.player.y, // Fixed: invert Y for proper collision
                width: 30,
                height: 30
            };
            
            for (let obstacle of gameState.obstacles) {
                const obstacleRect = {
                    x: obstacle.x,
                    y: 0,
                    width: 25,
                    height: 50
                };
                
                // More forgiving collision detection
                const buffer = 5;
                if (playerRect.x + buffer < obstacleRect.x + obstacleRect.width &&
                    playerRect.x + playerRect.width - buffer > obstacleRect.x &&
                    playerRect.y + buffer < obstacleRect.y + obstacleRect.height &&
                    playerRect.y + playerRect.height - buffer > obstacleRect.y) {
                    
                    console.log('💥 Collision! Player Y:', playerRect.y, 'Obstacle X:', obstacleRect.x);
                    gameOver();
                    return;
                }
            }
        }
        
        function updateScore() {
            gameState.score += 1;
            scoreElement.textContent = gameState.score;
            
            // Slower speed increase
            gameState.gameSpeed = Math.min(2 + (gameState.score / 1000), 4);
        }
        
        function gameOver() {
            console.log('💀 Game over! Score:', gameState.score);
            gameState.running = false;
            
            if (gameState.score > gameState.highScore) {
                gameState.highScore = gameState.score;
                localStorage.setItem('befjump-high-score', gameState.highScore.toString());
                highScoreElement.textContent = gameState.highScore;
                newHighScoreElement.style.display = 'block';
                console.log('🎉 New high score!', gameState.highScore);
            } else {
                newHighScoreElement.style.display = 'none';
            }
            
            finalScoreElement.textContent = gameState.score;
            gameOverScreen.style.display = 'block';
        }
        
        function gameLoop() {
            if (!gameState.running) return;
            
            updatePlayer();
            spawnObstacle();
            updateObstacles();
            checkCollisions();
            updateScore();
            
            requestAnimationFrame(gameLoop);
        }
        
        // Controls
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                jump();
            }
        });
        
        document.addEventListener('click', jump);
        
        console.log('✅ BefJump game ready!');
    </script>
</body>
</html>
