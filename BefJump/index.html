<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BefJump - Cube Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f7f7f7;
            color: #535353;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            user-select: none;
        }
        
        .game-area {
            width: 100vw;
            height: 100vh;
            background: white;
            position: relative;
            overflow: hidden;
        }
        
        .player {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #535353;
            bottom: 100px;
            left: 100px;
            transition: none;
            border-radius: 4px;
        }
        
        .obstacle {
            position: absolute;
            width: 20px;
            background: #535353;
            bottom: 100px;
        }
        
        .cloud {
            position: absolute;
            width: 80px;
            height: 40px;
            background: #ccc;
            border-radius: 40px;
            opacity: 0.5;
        }
        
        .ground-line {
            position: absolute;
            bottom: 100px;
            left: 0;
            width: 100%;
            height: 4px;
            background: #535353;
        }
        
        .score {
            position: absolute;
            top: 50px;
            right: 50px;
            font-size: 36px;
            font-weight: bold;
        }
        
        .start-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        
        .game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
        }
        
        .high-score {
            font-size: 24px;
            margin-top: 20px;
        }
        
        .instructions {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            color: #888;
        }
        
        .start-text {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        .game-over-text {
            font-size: 48px;
            margin-bottom: 20px;
            letter-spacing: 4px;
        }
        
        .debug {
            position: absolute;
            top: 120px;
            left: 50px;
            font-size: 16px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="game-area" id="gameArea">
        <div class="ground-line"></div>
        <div class="player" id="player"></div>
        <div class="score" id="score">00000</div>
        
        <div class="debug" id="debug">
            <div>Player Y: <span id="playerY">0</span></div>
            <div>Velocity: <span id="velocity">0</span></div>
            <div>Jumping: <span id="jumping">false</span></div>
        </div>
        
        <div class="start-screen" id="startScreen">
            <div class="start-text">Press SPACE to play</div>
            <div class="high-score">HI <span id="hiScore">00000</span></div>
        </div>
        
        <div class="game-over-screen" id="gameOverScreen">
            <div class="game-over-text">G A M E  O V E R</div>
            <div class="high-score">HI <span id="finalHiScore">00000</span></div>
            <div style="font-size: 24px; margin-top: 30px;">Press SPACE to restart</div>
        </div>
    </div>
    
    <div class="instructions">Use SPACEBAR or ↑ to jump</div>

    <script>
        let gameState = {
            running: false,
            gameStarted: false,
            score: 0,
            highScore: parseInt(localStorage.getItem('cube-runner-high-score') || '0'),
            player: { y: 0, jumping: false, velocity: 0 },
            obstacles: [],
            clouds: [],
            gameSpeed: 10, // Faster starting speed
            lastObstacle: 0,
            lastCloud: 0,
            obstaclePattern: 0 // Track pattern state
        };
        
        const player = document.getElementById('player');
        const gameArea = document.getElementById('gameArea');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const scoreElement = document.getElementById('score');
        const hiScoreElement = document.getElementById('hiScore');
        const finalHiScoreElement = document.getElementById('finalHiScore');
        
        // Debug elements
        const playerYElement = document.getElementById('playerY');
        const velocityElement = document.getElementById('velocity');
        const jumpingElement = document.getElementById('jumping');
        
        // Initialize
        hiScoreElement.textContent = String(gameState.highScore).padStart(5, '0');
        finalHiScoreElement.textContent = String(gameState.highScore).padStart(5, '0');
        
        function startGame() {
            gameState.running = true;
            gameState.gameStarted = true;
            gameState.score = 0;
            gameState.player = { y: 0, jumping: false, velocity: 0 };
            gameState.obstacles = [];
            gameState.clouds = [];
            gameState.gameSpeed = 10;
            gameState.lastObstacle = Date.now();
            gameState.lastCloud = Date.now();
            gameState.obstaclePattern = 0;
            
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            
            // Clear existing elements
            document.querySelectorAll('.obstacle').forEach(obs => obs.remove());
            document.querySelectorAll('.cloud').forEach(cloud => cloud.remove());
            
            // Reset player position
            player.style.bottom = '100px';
            player.style.transform = 'none';
            
            for(let i = 0; i < 5; i++) {
                spawnCloud();
            }
            
            gameLoop();
        }
        
        function jump() {
            if (!gameState.gameStarted) {
                startGame();
                return;
            }
            
            if (!gameState.running || gameState.player.jumping) return;
            
            gameState.player.jumping = true;
            gameState.player.velocity = -20;
        }
        
        function updatePlayer() {
            if (gameState.player.jumping) {
                gameState.player.velocity += 0.5;
                gameState.player.y += gameState.player.velocity;
                
                if (gameState.player.y >= 0) {
                    gameState.player.y = 0;
                    gameState.player.jumping = false;
                    gameState.player.velocity = 0;
                }
                
                player.style.bottom = (100 + Math.abs(gameState.player.y)) + 'px';
            }
            
            playerYElement.textContent = Math.round(gameState.player.y);
            velocityElement.textContent = Math.round(gameState.player.velocity * 10) / 10;
            jumpingElement.textContent = gameState.player.jumping;
        }
        
        function spawnObstacle() {
            const currentTime = Date.now();
            const baseDelay = 1200; // Shorter base delay
            let delay = baseDelay;
            let obstacleHeight = 80;
            let obstacleWidth = 20;
            
            // Create different patterns based on score
            const score = Math.floor(gameState.score / 6);
            
            if (score > 200) {
                // Very hard: random clusters and varying heights
                if (Math.random() < 0.3) {
                    delay = Math.random() * 500 + 400; // Very short gaps sometimes
                    obstacleHeight = Math.random() * 60 + 60; // 60-120px height
                    obstacleWidth = Math.random() * 15 + 15; // 15-30px width
                } else {
                    delay = Math.random() * 1000 + 800;
                }
            } else if (score > 100) {
                // Hard: occasional clusters
                if (Math.random() < 0.2) {
                    delay = Math.random() * 600 + 500; // Short gaps
                    obstacleHeight = Math.random() * 40 + 70; // 70-110px height
                } else {
                    delay = Math.random() * 1200 + 1000;
                }
            } else if (score > 50) {
                // Medium: slight variation
                delay = Math.random() * 1000 + 1000;
                if (Math.random() < 0.15) {
                    obstacleHeight = Math.random() * 30 + 70; // 70-100px height
                }
            } else {
                // Easy: standard pattern
                delay = Math.random() * 1000 + 1500;
            }
            
            if (currentTime - gameState.lastObstacle > delay) {
                const obstacle = document.createElement('div');
                obstacle.className = 'obstacle';
                obstacle.style.right = '-' + obstacleWidth + 'px';
                obstacle.style.height = obstacleHeight + 'px';
                obstacle.style.width = obstacleWidth + 'px';
                gameArea.appendChild(obstacle);
                
                gameState.obstacles.push({
                    element: obstacle,
                    x: window.innerWidth + obstacleWidth,
                    width: obstacleWidth,
                    height: obstacleHeight
                });
                
                gameState.lastObstacle = currentTime;
                
                // Sometimes spawn a second obstacle quickly for clusters
                if (score > 100 && Math.random() < 0.15) {
                    gameState.lastObstacle = currentTime - delay + 300; // Force quick next spawn
                }
            }
        }
        
        function spawnCloud() {
            if (Date.now() - gameState.lastCloud > Math.random() * 3000 + 4000) {
                const cloud = document.createElement('div');
                cloud.className = 'cloud';
                cloud.style.right = '-80px';
                cloud.style.top = Math.random() * (window.innerHeight - 300) + 100 + 'px';
                gameArea.appendChild(cloud);
                
                gameState.clouds.push({
                    element: cloud,
                    x: window.innerWidth + 80
                });
                
                gameState.lastCloud = Date.now();
            }
        }
        
        function updateObstacles() {
            gameState.obstacles = gameState.obstacles.filter(obstacle => {
                obstacle.x -= gameState.gameSpeed;
                obstacle.element.style.right = (window.innerWidth - obstacle.x) + 'px';
                
                if (obstacle.x < -obstacle.width) {
                    obstacle.element.remove();
                    return false;
                }
                return true;
            });
        }
        
        function updateClouds() {
            gameState.clouds = gameState.clouds.filter(cloud => {
                cloud.x -= gameState.gameSpeed * 0.5;
                cloud.element.style.right = (window.innerWidth - cloud.x) + 'px';
                
                if (cloud.x < -80) {
                    cloud.element.remove();
                    return false;
                }
                return true;
            });
        }
        
        function checkCollisions() {
            const playerRect = {
                x: 100,
                y: Math.abs(gameState.player.y),
                width: 40,
                height: 40
            };
            
            for (let obstacle of gameState.obstacles) {
                const obstacleRect = {
                    x: obstacle.x,
                    y: 0,
                    width: obstacle.width,
                    height: obstacle.height
                };
                
                if (playerRect.x < obstacleRect.x + obstacleRect.width &&
                    playerRect.x + playerRect.width > obstacleRect.x &&
                    playerRect.y < obstacleRect.y + obstacleRect.height &&
                    playerRect.y + playerRect.height > obstacleRect.y) {
                    
                    gameOver();
                    return;
                }
            }
        }
        
        function updateScore() {
            gameState.score += 1;
            
            if (gameState.score % 6 === 0) {
                const displayScore = Math.floor(gameState.score / 6);
                scoreElement.textContent = String(displayScore).padStart(5, '0');
                
                // More aggressive speed increases
                if (displayScore % 50 === 0 && displayScore > 0) {
                    gameState.gameSpeed += 1.5; // Faster speed increases
                }
            }
        }
        
        function gameOver() {
            gameState.running = false;
            
            const finalScore = Math.floor(gameState.score / 6);
            
            if (finalScore > gameState.highScore) {
                gameState.highScore = finalScore;
                localStorage.setItem('cube-runner-high-score', gameState.highScore.toString());
                hiScoreElement.textContent = String(gameState.highScore).padStart(5, '0');
                finalHiScoreElement.textContent = String(gameState.highScore).padStart(5, '0');
            }
            
            gameOverScreen.style.display = 'block';
        }
        
        function gameLoop() {
            if (!gameState.running) return;
            
            updatePlayer();
            spawnObstacle();
            spawnCloud();
            updateObstacles();
            updateClouds();
            checkCollisions();
            updateScore();
            
            requestAnimationFrame(gameLoop);
        }
        
        // Controls
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                jump();
            }
        });
        
        document.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        });
        
        document.addEventListener('keydown', (e) => {
            if (!gameState.running && gameState.gameStarted && (e.code === 'Space' || e.code === 'ArrowUp')) {
                e.preventDefault();
                startGame();
            }
        });
        
        window.addEventListener('resize', () => {
            gameState.obstacles.forEach(obstacle => {
                obstacle.element.style.right = (window.innerWidth - obstacle.x) + 'px';
            });
            gameState.clouds.forEach(cloud => {
                cloud.element.style.right = (window.innerWidth - cloud.x) + 'px';
            });
        });
    </script>
</body>
</html>
