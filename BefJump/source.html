<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BefJump - Befunge Source Code</title>
    <link rel="icon" type="image/png" href="logo1.png">
    <style>
        body { 
            font-family: 'Courier New', monospace; 
            padding: 20px; 
            background: #0d1117; 
            color: #e6edf3; 
            margin: 0;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 { 
            color: #4ecdc4; 
            text-align: center;
            margin-bottom: 10px;
        }
        
        .subtitle {
            text-align: center;
            color: #7d8590;
            margin-bottom: 30px;
        }
        
        .source-container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            overflow: hidden;
        }
        
        .source-header {
            background: #21262d;
            padding: 12px 20px;
            border-bottom: 1px solid #30363d;
            color: #f0f6fc;
            font-weight: bold;
        }
        
        pre { 
            background: transparent;
            padding: 20px; 
            margin: 0;
            overflow-x: auto;
            font-size: 14px;
            line-height: 1.45;
            color: #e6edf3;
        }
        
        .loading {
            text-align: center;
            color: #7d8590;
            padding: 40px;
        }
        
        .error {
            text-align: center;
            color: #f85149;
            padding: 40px;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #4ecdc4;
            text-decoration: none;
            font-size: 14px;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            font-size: 14px;
            color: #7d8590;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-number {
            display: block;
            color: #4ecdc4;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to Game</a>
        
        <h1>BefJump - Befunge Source Code</h1>
        <p class="subtitle">Real-time view of the game source code</p>
        
        <div class="source-container">
            <div class="source-header">
                📄 game.bf
            </div>
            <pre id="source" class="loading">Loading source code...</pre>
        </div>
        
        <div class="stats">
            <div class="stat">
                <span class="stat-number" id="lineCount">-</span>
                <span>Lines</span>
            </div>
            <div class="stat">
                <span class="stat-number" id="charCount">-</span>
                <span>Characters</span>
            </div>
            <div class="stat">
                <span class="stat-number" id="lastUpdated">-</span>
                <span>Last Loaded</span>
            </div>
        </div>
    </div>
    
    <script>
        function loadSourceCode() {
            const sourceElement = document.getElementById('source');
            const lineCountElement = document.getElementById('lineCount');
            const charCountElement = document.getElementById('charCount');
            const lastUpdatedElement = document.getElementById('lastUpdated');
            
            // Add cache busting to ensure we get the latest version
            const timestamp = new Date().getTime();
            
            fetch(`game.bf?t=${timestamp}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    return response.text();
                })
                .then(code => {
                    sourceElement.textContent = code;
                    sourceElement.className = '';
                    
                    // Update stats
                    const lines = code.split('\n').length;
                    const chars = code.length;
                    const now = new Date().toLocaleTimeString();
                    
                    lineCountElement.textContent = lines;
                    charCountElement.textContent = chars;
                    lastUpdatedElement.textContent = now;
                })
                .catch(error => {
                    sourceElement.textContent = `Error loading source code: ${error.message}`;
                    sourceElement.className = 'error';
                    console.error('Source load error:', error);
                });
        }
        
        // Load immediately
        loadSourceCode();
        
        // Auto-refresh every 30 seconds to catch updates
        setInterval(loadSourceCode, 30000);
        
        // Refresh when page becomes visible again
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                loadSourceCode();
            }
        });
    </script>
</body>
</html>
