<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Cal Flynn</title>
    <meta name="description" content="Oops! The page you're looking for doesn't exist.">
    
    <link rel="icon" type="image/gif" href="https://media.tenor.com/divc98ce49MAAAAM/nono-nuh-uh.gif">
    <link rel="icon" type="image/png" href="assets/C.png">
    
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="404.css">
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="floating-shapes">
        <div class="shape" style="top: 20%; left: 10%; width: 50px; height: 50px; background: white; border-radius: 50%;"></div>
        <div class="shape" style="top: 60%; right: 15%; width: 30px; height: 30px; background: white; clip-path: polygon(50% 0%, 0% 100%, 100% 100%);"></div>
        <div class="shape" style="top: 80%; left: 20%; width: 40px; height: 40px; background: white; clip-path: polygon(25% 0%, 100% 0%, 75% 100%, 0% 100%);"></div>
    </div>

    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-message">Page Not Found</div>
        <div class="error-subtitle">
            Oops! The page you're looking for seems to have vanished into the digital void. 
            Don't worry though, even the best developers get lost sometimes! 🚀
        </div>
        
        <div class="error-actions">
            <a href="index.html" class="error-btn primary">
                🏠 Go Home
            </a>
            <a href="coding.html" class="error-btn">
                💻 View Projects
            </a>
            <a href="javascript:history.back()" class="error-btn">
                ← Go Back
            </a>
        </div>
        
        <div class="redirect-timer">
            Automatically redirecting to home in <span id="countdown">10</span> seconds...
        </div>
    </div>

    <div class="easter-egg" onclick="playEasterEgg()">
        <img src="https://media.tenor.com/divc98ce49MAAAAM/nono-nuh-uh.gif" alt="Nope!" id="easterEggGif">
    </div>

    <script src="404.js"></script>
</body>
</html>
